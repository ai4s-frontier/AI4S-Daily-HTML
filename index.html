<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI4S 每日研判 · 归档</title>
    <meta name="description" content="AI4S 每日前瞻研判报告归档" />
    <script>
      // 首屏前确定暗色,避免闪烁
      ;(function () {
        var t = localStorage.getItem('dnews-theme')
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
